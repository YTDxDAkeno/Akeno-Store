name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 libclang-rt-18-dev cmake ninja-build \
            python3-pil libsdl2-dev libcurl4-openssl-dev
      - name: Native core tests (host)
        run: make -C native test
      - name: Host hub tests
        run: python3 -m unittest discover -s tests
      - name: PS5 title (eboot.bin, libc.prx, PPSA90410.zip)
        run: bash ps5/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: akeno-ps5-PPSA90410
          path: |
            ps5/dist/PPSA90410.zip
            ps5/dist/SHA256SUMS
